    mouse: resources/annotations/round2/mouse_lineage.csv   # 5 -> vascular, 7 -> smc, 19 -> immune
    human: resources/annotations/round2/human_lineage.csv   # 30 -> immune
  atlas_sha256:          # the July whole-tissue fits, data/interim/latent_{species}.h5ad
    mouse: e03cccf83408cd4b93e3223b9d02c3b4a77003c79c841e3a4d10568ebc4e0861
    human: 3a04bba5b7b6e55b0304fb45de9223e85eaf8b32bcdd5217cc798211c10eba80
  lineages:
    mouse: [immune, vascular, smc]
    human: [immune]
  decisions_dir: resources/annotations/round2   # 04c2: {species}_{lineage}.csv, approved 2026-10-30
  latent_sha256:         # the round-2 fits (PROVENANCE.json: A40, scvi-tools 1.4.2, seed 0)
    human_immune: 661387a2218115847daac215713114525aea464ae00bf83387b1786b9f0b26a8
    mouse_immune: 18fdd222d16b4550d55829256bba7840678e0f11107a6c3c2582733ce11dac06
    mouse_vascular: ad3d7d84f07eccc6d398bb382d9c58a04633a20b42763702cc5c7599cafc8d2d
    mouse_smc: 88e8954d55ad746041d35ab5dbc1f192745b2dcf380250c4841e6f675b8e754e
  spatial_qc_overrides:  # 04c2 spatial_qc_round2: settings for species outside spatial_qc.species
    # human: exact duplicate coordinates only (no kNN floor, no far cut, no boxes; one section per sample).
    # These settings reproduce the human release QC of 2026-09-02 (user decision) for all 69,146 nuclei.
    human: {n_mads: .inf, floor_um: 0.0, exclusions: {human: []}, sections: {human: []}, rotations: {human: {}}}
# Release map: version label -> release folder, data/deliverables/<folder>. Every rule reads release folders and
# version labels from this map and deliverables.version / deliverables.release (workflow/rules/00_release.smk).
releases:
  v8: "2026_10_29b"
  v9: "2026_10_30"
  v10: "2026_11_02"
# Pseudotime of record of the fibroblast/decidual objects where it is newer than the release's own (decision G):
# the 30 Oct 2026 human refit. refresh_fibdec_round2 (04g2) writes it into the release object (obs pt_harmonized_rank
# <- column, pt_harmonized <- raw_column, obsm X_diffmap_harmonized <- dc0..; uns pt_harmonized the run record), so
# the deposit copies it unchanged. Same run as deposit_objects.pseudotime_of_record (95 checks that they agree).
pseudotime_of_record:
  human:
    path: data/interim/human_pt_2026_10_30_run4_a40/cells.parquet
    column: pt_rank
    sha256: 956a07cdb97d9a99dd769088a66e717b60956b81b45cb3e3d625057dacb2f94f
    raw_column: pt_raw
    run_record: data/interim/human_pt_2026_10_30_run4_a40/provenance.json
    script: data/interim/human_pt_2026_10_30_run4_a40/harmonized_pseudotime_fibdec.py
    latent_copy: "/n/lab_storage/eddy_lab/users/nhilgert/tmp/2026_10_30_human_fibdec_latent/run4_a40/fibdec/\
      latent_human_stromal_fibdec.h5ad"
    latent_sha256: 80f3f7eac5fdff9c17ef2b0a5580f5087a9720639704ecd381e481608181b471
    note: >-
      Human stromal scVI latent refit on the 47,533 fibroblast and decidual nuclei only, with the mouse settings
      (30 Oct 2026). The pseudotime was computed on that latent (latent_copy), not on obsm X_scVI, the stromal-lineage
      latent of 04b_reintegrate that gives the UMAP. The script is harmonized_pseudotime.py with only the latent path
      changed.
deliverables:
  # 04g finalize_deliverables promotes the four release objects into an immutable, sha256-manifested folder,
  # data/deliverables/<release>. The release of record is `version` and `release` (= releases[version]); to cut the
  # next release, set both and run snakemake. Once its MANIFEST.json exists a release is cut and no rule rebuilds it.
  # History of the releases:
  # 2026_09_15 canonicalizes the NETSCRATCH copies -- the versions SCENIC/LIANA
  # consumed. Fib/dec are supersets of the 2026_08_28 repo copies (add
  # rank-normalised DPT + diffmap; human also donor + a leiden ladder). NOTE:
  # the XMens All netscratch copy differs at VALUE level from the repo copy
  # (same size, 11 min apart, cause unrecorded); netscratch chosen for
  # consistency with the arms that consumed it. Supersedes
  # data/deliverables/2026_08_28_* and 2026_09_02_* (retained, untouched).
  # 2026_10_25 is 2026_09_15 relabeled to vocabulary v3 by migrate_release_vocabulary
  # (mouse uNK names; mouse luminal/glandular epithelium). Same cells and clusters;
  # expression, embeddings and all other obs columns are unchanged.
  # 2026_10_27 is 2026_10_22_flagged_harmonized (2026_09_15 plus embedding_outlier and the
  # harmonized pseudotime of record) relabeled to vocabulary v4 by migrate_release_vocabulary:
  # v3 names and splits as in 2026_10_25, mouse stromal subtypes stored as eFib1..eFibP, dec1..decAp.
  # 2026_10_27b is the same source relabeled to vocabulary v5: 2026_10_27 with the mouse timepoints
  # named half a day later (1.5_dpi_early ... 4.5_dpi_bleeding); sample IDs unchanged.
  # 2026_10_28 is the same source relabeled to vocabulary v6: 2026_10_27b with the immune subtypes
  # stored as the snake_case names of the immune dot plots (cd8_t_cell, cytotoxic_unk_cell, ...).
  # 2026_10_29 is the same source relabeled to vocabulary v7 (epithelium split by tissue position in
  # both species), with the human all-cells object rebuilt by release_reembed (since replaced by
  # release_rebuild): 1,017 epithelial
  # nuclei reinstated (clusters 11, 22, 44) and the whole-tissue embedding re-fitted.
  # 2026_10_29b (vocabulary v8) is 2026_10_29 rebuilt by release_rebuild below: human immune cluster 0
  # (55 macrophage-epithelial doublets) and mouse epithelial cluster 28 (18 low-quality nuclei) dropped; the
  # whole-tissue embedding of each species re-fitted on its primary nuclei plus the supplementary populations
  # (human B cells; mouse lymphatic endothelium, pericytes, IgA plasma cells), which are released only in the
  # *_All_Cells_extended objects (obs in_primary); the fib/dec objects take the new whole-tissue embedding and
  # outlier flags.
  # 2026_10_30 (vocabulary v9) is 2026_10_29b rebuilt by release_round2 (04g2): the four lineages re-annotated in
  # round 2 (mouse immune, vascular, smc; human immune) replace their v8 nuclei, the spatial QC is re-run over the
  # nuclei the round-2 atlas tables keep, each species' whole-tissue embedding is re-fitted (A40) and the fib/dec
  # objects take the new embedding, outlier flags and spatial QC. No extended objects.
  release: "2026_10_30"   # quoted: a bare date parses as an integer in YAML
  version: v9
  # The release objects; their sources are <release_round2 folder of the release>/<object>.h5ad (04g2).
  objects: [Cevrim_Human_All_Cells, Cevrim_Human_Only_Fib_Dec_Cells, Cevrim_XMens_All_Cells,
            Cevrim_XMens_Only_Fib_Dec_Cells]
  # MANIFEST note of each release; `default` for a version without its own. {from_release}, {embedding} and
  # {release} are filled in by 04g.
  notes:
    v9: >-
      2026_10_29b rebuilt to annotation vocabulary v9 (release_round2) - the four lineages re-annotated in round 2
      (mouse immune, vascular, smc; human immune; resources/annotations/round2) replace their v8 nuclei; spatial QC
      re-run over the nuclei the round-2 atlas tables keep; whole-tissue embeddings re-fitted on all nuclei; fib/dec
      objects switched to the new embedding, outlier flags and spatial QC; see MANIFEST.json,
      results/tables/round2_release_cells_*_2026_10_30.tsv and results/tables/round2_embedding_outliers_*_2026_10_30.csv
    default: >-
      {from_release} rebuilt by release_round2 (04c2, 04g2) with the round-2 decision tables and the annotation
      vocabulary in force at the cut; whole-tissue embedding: {embedding}; human fib/dec pseudotime: the pseudotime of
      record (config pseudotime_of_record.human); counts and changes in results/release_notes/ and
      results/tables/round2_release_cells_*_{release}.tsv
vocab_migration:
  # Release relabeled by migrate_release_vocabulary (04g), and where the relabeled
  # objects are written before finalize_deliverables promotes them.
  # 2026_10_22_flagged_harmonized: lab_storage copy (sha256-verified) of the netscratch set
  # that added embedding_outlier and the harmonized pseudotime to 2026_09_15 (see its README).
  from_release: "2026_10_22_flagged_harmonized"
  outdir: /n/netscratch/eddy_lab/Everyone/nhilgert/2026_10_29_vocab_v7
  # Cell-level subtype splits (content tasks), applied after the renames. Each relabels
  # cells of `cell_type` whose cell_subtype is still the coarse fill, as
  # decisions[cluster] on the clustering the decisions were written against. The
  # clustering file is pinned by sha256: the split refuses any other embedding.
  subtype_splits:
    mouse_epithelial_split:            # expected counts: annotation_vocabulary.yaml content_tasks
      object: Cevrim_XMens_All_Cells
      cell_type: epithelial_cell
      clusters: data/interim/latent_mouse_epithelial.h5ad      # July 29 mouse epithelial lineage embedding
      clusters_sha256: 75243c93d329466424aa338c466ac8b4a4df51ff4421795b2769bb7573526429
      cluster_column: leiden_scVI_3.0
      decisions: resources/annotations/mouse_epithelial.csv
# release_reembed (2026_10_29: human epithelial clusters 11, 22, 44 reinstated and re-embedded) was replaced by
# release_rebuild for 2026_10_29b; its settings are in the 2026_10_29 patch and MANIFEST.
release_rebuild:
  # 04g rebuild_release_cells -> reembed_release -> finish_rebuilt_release -> refresh_fibdec_release (v8):
  # each species' all-cells object of from_release loses the class clusters newly EXCLUDE in v8 (dropped),
  # gains the supplementary populations (extended objects only), is re-embedded on all of these nuclei
  # (integrate.py on an A40; see profiles/slurm) and is written as primary and extended objects; the fib/dec
  # objects take the new whole-tissue embedding (fibdec_embedding: fib/dec obsm <- all-cells obsm) and flags.
  from_release: "2026_10_29"
  outdir: /n/netscratch/eddy_lab/Everyone/nhilgert/2026_10_29b_rebuild
  supplementary: resources/annotations/supplementary_populations.csv
  species:
    human:
      tag: Human
      atlas: data/interim/latent_human.h5ad                  # whole-tissue clustering (July fit)
      atlas_sha256: 3a04bba5b7b6e55b0304fb45de9223e85eaf8b32bcdd5217cc798211c10eba80
      atlas_cluster_column: leiden_scVI_2.5
      lineage_decisions: resources/annotations/human_lineage.csv
      dropped:
        - clusters: data/interim/latent_human_immune.h5ad
          clusters_sha256: 50c0801938ed18e61a26f9d3f6a241106f7e9a5f2fc194984ac7785d0397b2a5
          cluster_column: leiden_scVI_3.0
          decisions: resources/annotations/human_immune.csv
          excluded: ["0"]
      fibdec_embedding: {X_scVI_wholetissue: X_scVI, X_umap_wholetissue: X_umap_scVI}
    mouse:
      tag: XMens
      atlas: data/interim/latent_mouse.h5ad
      atlas_sha256: e03cccf83408cd4b93e3223b9d02c3b4a77003c79c841e3a4d10568ebc4e0861
      atlas_cluster_column: leiden_scVI_2.5
      lineage_decisions: resources/annotations/mouse_lineage.csv
      dropped:
        - clusters: data/interim/latent_mouse_epithelial.h5ad
          clusters_sha256: 75243c93d329466424aa338c466ac8b4a4df51ff4421795b2769bb7573526429
          cluster_column: leiden_scVI_3.0
          decisions: resources/annotations/mouse_epithelial.csv
          excluded: ["28"]
      fibdec_embedding: {X_scVI: X_scVI, X_umap_scVI: X_umap_scVI}
release_round2:
  # 04g2 rebuild_release_round2 -> reembed_release_round2 -> finish_release_round2 -> refresh_fibdec_round2 (v9):
  # each species' all-cells object of from_release swaps the nuclei of the round-2 lineages for their kept
  # round-2 nuclei (annotation_round2), takes the round-2 spatial QC, is re-embedded on all of its nuclei
  # (integrate.py on an A40; see profiles/slurm) and finished; the fib/dec objects take the new embedding
  # (fibdec_embedding: fib/dec obsm <- all-cells obsm), outlier flags and spatial QC.
  from_version: v8      # the release every round-2 release rebuilds (config releases)
  # Folder of a release's 04c2/04g2 intermediates, on lab_storage and named for the release ({release}). Releases cut
  # before these folders keep the folder their MANIFEST records (outdir_of_version).
  outdir: "data/interim/release_{release}"
  outdir_of_version:
    v9: /n/netscratch/eddy_lab/Everyone/nhilgert/2026_10_30_release_v9
  legacy_names: resources/annotations/round2/legacy_names.csv   # legacy label columns of each round-2 label
  species:
    human:
      tag: Human
      fibdec_embedding: {X_scVI_wholetissue: X_scVI, X_umap_wholetissue: X_umap_scVI}
    mouse:
      tag: XMens
      fibdec_embedding: {X_scVI: X_scVI, X_umap_scVI: X_umap_scVI}
samap:
  # Shared SAMap settings: the homology maps (19_homology) and the raw all-by-all arm (21_samap_raw) read root,
  # proteomes_root, saturn_python and phmmer. The per-timepoint-pair transfer arm (20_samap_transfer) was archived
  # 2026-11-01 (tmp/2026_11_01_samap_transfer_archive); its keys fit, coords_root, python, pairs and pt_h5ad went with it.
  root: /n/lab_storage/eddy_lab/users/nhilgert/decidualization/revisions/samap_integrate
  proteomes_root: /n/lab_storage/eddy_lab/users/nhilgert/data/proteomes
  saturn_python: /n/lab_storage/eddy_lab/users/nhilgert/.uv/envs/saturn_uv/bin/python
  phmmer: /n/lab_storage/eddy_lab/users/nhilgert/software/hmmer-3.4/src/phmmer
  n_iter: 3
mi_pseudotime:
  # MI(gene expression, harmonized pseudotime), rules in 11_mi_pseudotime.smk.
  # Every arm scores all of its nuclei (no estimator subsample) on genes detected in
  # >= 1% of them; Fig. S16, the cross-species overlap and the heatmap pool read these.
  python: /n/lab_storage/eddy_lab/users/nhilgert/.uv/envs/rsc_uv/bin/python
  outdir: results/mi_dpt
  n_chunks: 200            # one SLURM job per chunk, genes split evenly; an arm's n_chunks overrides this
  perms: 1001              # shuffles of pseudotime, counting the observed one: min p = 1/1001
  min_counts: 10           # raw counts summed over the arm's nuclei
  min_detect_frac: 0.01    # detected (count > 0) in >= 1% of the arm's nuclei
  subsample_cells: 0       # 0 = the MI estimator uses every nucleus
  seed: 0
  control_seed: 0          # draw of the size-matched induced control arm
  # Not a layer of the objects: prep then recomputes log1p(CP10K) from layers['counts'].
  layer: derive_from_counts
  # Fibroblast/decidual objects carrying obs pt_harmonized and pt_harmonized_rank (build_flagged_objects.py, 22 Oct).
  # human: the lab_storage copy (sha256 36c86b27... equals the netscratch object and MANIFEST.json output_sha256);
  # only the record arm reads it, and that arm is rebuilt anyway. mouse stays on purgeable netscratch: repointing it
  # changes the recorded input of three finished arms, and the default rerun triggers would recompute them (810
  # jobs). To move it, repoint to data/deliverables/2026_10_22_flagged_harmonized/Cevrim_XMens_Only_Fib_Dec_Cells.h5ad
  # (sha256 75f1a7c5..., same file) and run mi_all once with --rerun-triggers mtime params code.
  objects:
    mouse: /n/netscratch/eddy_lab/Everyone/nhilgert/2026_10_22_flagged_harmonized/Cevrim_XMens_Only_Fib_Dec_Cells.h5ad
    human: data/deliverables/2026_10_22_flagged_harmonized/Cevrim_Human_Only_Fib_Dec_Cells.h5ad
  # worker_runtime_min: SLURM limit per chunk; observed maxima were 6.1 h (mouse) and
  # 7.0 h (human) for the 200-chunk main arms. worker_mem_mb: memory per chunk (default 32000).
  # n_chunks is part of the result (each chunk seeds its own permutations), so every arm keeps the count it ran with.
  arms:
    pt_harmonized_mouse_nall:
      object: mouse
      pt_key: pt_harmonized_rank
      worker_runtime_min: 720
    # Human arm of record (decision G): obs pt_harmonized_rank replaced by the human pseudotime of record (config
    # pseudotime_of_record.human, the 30 Oct 2026 refit, sha256-checked) before prep. 1,500 chunks, as in the run the
    # Methods quote (netscratch 2026_10_30_human_fibdec_latent/mi_fibdec_a40: sbatch --array=0-1499, 3 h and 6 GB
    # per chunk; 8 GB is requested here for headroom, below the 32 GB worker default); the 22 Oct object and that
    # run's input hold the same nuclei, order and counts.
    pt_harmonized_human_nall:
      object: human
      pt_key: pt_harmonized_rank
      pseudotime_of_record: human
      n_chunks: 1500
      worker_runtime_min: 180
      worker_mem_mb: 8000
    # Specificity controls: pt_key is ranked within each sample into pt_norm.
    pt_harmonized_unind_mouse_nall:
      object: mouse
      control: uninduced
      pt_key: pt_harmonized
      worker_runtime_min: 240
    pt_harmonized_indmatch_mouse_nall:
      object: mouse
      control: induced_matched
      pt_key: pt_harmonized
      worker_runtime_min: 240

# ---------------------------------------------------------------------------
# methods_numbers (stage 97) -- pipeline-derived numbers of the computational Methods for the release of record
# (deliverables.release). Rules: workflow/rules/97_methods_numbers.smk; target: methods_numbers_all; outputs in
# results/methods_numbers/<release>/registry/. Registry: workflow/scripts/methods_numbers (README.md).
# ---------------------------------------------------------------------------
methods_numbers:
  python: /n/lab_storage/eddy_lab/users/nhilgert/.uv/envs/rsc_uv/bin/python
