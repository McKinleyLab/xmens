    outdir: results/mi_dpt/overlap_of_record
    mouse_arm: pt_harmonized_mouse_nall
    human_arm: pt_harmonized_human_nall
    control_arms: [pt_harmonized_unind_mouse_nall, pt_harmonized_indmatch_mouse_nall]   # uninduced, induced_matched
